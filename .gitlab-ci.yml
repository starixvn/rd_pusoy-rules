variables:
    NODEJS_IMAGE: $DOCKER_REG_LOCAL_URL/docker-hub/library/node:lts-slim
    PUBLISH_NPM_IMAGE: $DOCKER_REG_LOCAL_URL/docker-hub/library/node:lts-slim
    ENABLE_TEST_JS: "true"
    SRC_PATH: src
    PUBLISH_NPM: "true"
    NPM_LANG_TS: "true"

include:
    - project: ci/core-cicd
      ref: main
      file: luminet.gitlab-ci.yml

integration-test-settle:
    stage: test
    image: $NODEJS_IMAGE
    tags:
        - ci
    before_script:
        - npm run reg
        - npm install
    script:
        - npm run integration-test
    artifacts:
        when: always
        paths:
            - ./coverage
        reports:
            junit:
                - ./coverage/integration-tests.xml
        expire_in: 1 day

.unit_test_js:
    artifacts:
        when: always
        paths:
            - ./**/lcov.info
            - ./coverage
        reports:
            junit:
                - ./coverage/unit-tests.xml
        expire_in: 1 day
