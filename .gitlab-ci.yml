variables:
    NODEJS_IMAGE: $DOCKER_REG_LOCAL_URL/docker-hub/library/node:lts-slim
    PUBLISH_NPM_IMAGE: $DOCKER_REG_LOCAL_URL/docker-hub/library/node:lts-slim
    ENABLE_TEST_JS: "true"
    PUBLISH_NPM: "true"

include:
    - project: ci/core-cicd
      ref: main
      file: luminet.gitlab-ci.yml

integration-test-settle:
    stage: test
    image: $NODEJS_IMAGE
    tags:
        - ci
    before_script:
        - npm run reg
        - npm install
    script:
        - npm run integration-test
    artifacts:
        when: always
        reports:
            junit:
                - junit.xml
